# Apply after compose.yaml. Both serving and all scheduler collection/rebuild
# commands use the verified content-addressed image, without rebuilding on host.
services:
  migrate:
    image: ${SMAKO_RELEASE_IMAGE:?set verified sha256 image ID}
    build: !reset null
  app:
    image: ${SMAKO_RELEASE_IMAGE:?set verified sha256 image ID}
    build: !reset null
    env_file: ${SMAKO_RELEASE_ENV_FILE:?set reviewed private release environment}
  scheduler:
    image: ${SMAKO_RELEASE_IMAGE:?set verified sha256 image ID}
    build: !reset null
    env_file: ${SMAKO_RELEASE_ENV_FILE:?set reviewed private release environment}
  refresh-once:
    image: ${SMAKO_RELEASE_IMAGE:?set verified sha256 image ID}
    build: !reset null
    env_file: ${SMAKO_RELEASE_ENV_FILE:?set reviewed private release environment}
  backup-once:
    image: ${SMAKO_RELEASE_IMAGE:?set verified sha256 image ID}
    build: !reset null
