name: billigaste-veckomenyn-beta

x-app-image: &app-image
  image: billigaste-veckomenyn:${APP_VERSION:-0.1.0-beta}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-0.1.0-beta}
      BUILD_ID: ${BUILD_ID:?set BUILD_ID}

x-app-environment: &app-environment
  TZ: Europe/Stockholm
  PYTHON_DOTENV_DISABLED: "true"
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-0.1.0-beta}
  BUILD_ID: ${BUILD_ID:?set BUILD_ID}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  BETA_ADMIN_TOKEN: ${BETA_ADMIN_TOKEN:?set BETA_ADMIN_TOKEN}
  GROCERY_DATABASE_URL: ${GROCERY_DATABASE_URL:?set GROCERY_DATABASE_URL}
  PLAN_STORE_PATH: ${PLAN_STORE_PATH:?set PLAN_STORE_PATH}
  GROCERY_RAW_SNAPSHOT_ROOT: ${GROCERY_RAW_SNAPSHOT_ROOT:?set GROCERY_RAW_SNAPSHOT_ROOT}
  PRICE_UNIVERSE_CACHE_ROOT: ${PRICE_UNIVERSE_CACHE_ROOT:?set PRICE_UNIVERSE_CACHE_ROOT}
  PRICE_UNIVERSE_REQUIRED: ${PRICE_UNIVERSE_REQUIRED:-true}
  PRICE_UNIVERSE_REQUIRED_CONTEXT_IDS: ${PRICE_UNIVERSE_REQUIRED_CONTEXT_IDS:-}
  PRICE_UNIVERSE_CITY: ${PRICE_UNIVERSE_CITY:-Lund}
  REFRESH_REPORT_DIR: ${REFRESH_REPORT_DIR:-/srv/app/var/reports/refresh}
  REFRESH_RUNNER_STATUS_PATH: ${REFRESH_RUNNER_STATUS_PATH:-/srv/app/var/reports/operations/refresh-runner-status.json}
  DAILY_REFRESH_SCHEDULE: ${DAILY_REFRESH_SCHEDULE:-03:17 Europe/Stockholm}
  # Explicit structured-only release. Disabled preserves the existing schedule.
  ICA_STRUCTURED_OFFERS_ENABLED: ${ICA_STRUCTURED_OFFERS_ENABLED:-false}
  ICA_STRUCTURED_OFFERS_ROOT: ${ICA_STRUCTURED_OFFERS_ROOT:-/srv/app/var/grocery/ica-structured-offers}
  ICA_AREA_OFFER_CANDIDATES_ENABLED: "false"
  ICA_FLYER_PAID_ENABLED: "false"
  ICA_FLYER_VISUAL_COMMAND_JSON: "null"
  DEMAND_REFRESH_ENABLED: ${DEMAND_REFRESH_ENABLED:-false}
  DEMAND_REFRESH_CRON: ${DEMAND_REFRESH_CRON:-*/15 * * * *}
  DEMAND_REFRESH_STATE_PATH: ${DEMAND_REFRESH_STATE_PATH:-/srv/app/var/reports/operations/demand-refresh.json}
  COOP_RETRY_SCHEDULE: ${COOP_RETRY_SCHEDULE:-06:17 Europe/Stockholm}
  PLANNER_RATE_LIMIT_REQUESTS: ${PLANNER_RATE_LIMIT_REQUESTS:-8}
  PLANNER_RATE_LIMIT_WINDOW_SECONDS: ${PLANNER_RATE_LIMIT_WINDOW_SECONDS:-60}
  PLANNER_MAX_CONCURRENT_REQUESTS: ${PLANNER_MAX_CONCURRENT_REQUESTS:-1}
  PLANNER_MAX_QUEUED_REQUESTS: ${PLANNER_MAX_QUEUED_REQUESTS:-4}
  FEEDBACK_RATE_LIMIT_REQUESTS: ${FEEDBACK_RATE_LIMIT_REQUESTS:-10}
  FEEDBACK_RATE_LIMIT_WINDOW_SECONDS: ${FEEDBACK_RATE_LIMIT_WINDOW_SECONDS:-3600}
  FRONTEND_ERROR_RATE_LIMIT_REQUESTS: ${FRONTEND_ERROR_RATE_LIMIT_REQUESTS:-30}
  FRONTEND_ERROR_RATE_LIMIT_WINDOW_SECONDS: ${FRONTEND_ERROR_RATE_LIMIT_WINDOW_SECONDS:-3600}
  ANALYTICS_RATE_LIMIT_REQUESTS: ${ANALYTICS_RATE_LIMIT_REQUESTS:-180}
  ANALYTICS_RATE_LIMIT_WINDOW_SECONDS: ${ANALYTICS_RATE_LIMIT_WINDOW_SECONDS:-3600}
  COMMUNITY_RATE_LIMIT_REQUESTS: ${COMMUNITY_RATE_LIMIT_REQUESTS:-30}
  COMMUNITY_RATE_LIMIT_WINDOW_SECONDS: ${COMMUNITY_RATE_LIMIT_WINDOW_SECONDS:-3600}
  RECEIPT_RATE_LIMIT_REQUESTS: ${RECEIPT_RATE_LIMIT_REQUESTS:-8}
  RECEIPT_RATE_LIMIT_WINDOW_SECONDS: ${RECEIPT_RATE_LIMIT_WINDOW_SECONDS:-3600}
  PRIVACY_ERASURE_RATE_LIMIT_REQUESTS: ${PRIVACY_ERASURE_RATE_LIMIT_REQUESTS:-3}
  PRIVACY_ERASURE_RATE_LIMIT_WINDOW_SECONDS: ${PRIVACY_ERASURE_RATE_LIMIT_WINDOW_SECONDS:-3600}
  PLANNER_NETWORK_RATE_LIMIT_REQUESTS: ${PLANNER_NETWORK_RATE_LIMIT_REQUESTS:-40}
  FEEDBACK_NETWORK_RATE_LIMIT_REQUESTS: ${FEEDBACK_NETWORK_RATE_LIMIT_REQUESTS:-50}
  FRONTEND_ERROR_NETWORK_RATE_LIMIT_REQUESTS: ${FRONTEND_ERROR_NETWORK_RATE_LIMIT_REQUESTS:-150}
  ANALYTICS_NETWORK_RATE_LIMIT_REQUESTS: ${ANALYTICS_NETWORK_RATE_LIMIT_REQUESTS:-900}
  COMMUNITY_NETWORK_RATE_LIMIT_REQUESTS: ${COMMUNITY_NETWORK_RATE_LIMIT_REQUESTS:-150}
  RECEIPT_NETWORK_RATE_LIMIT_REQUESTS: ${RECEIPT_NETWORK_RATE_LIMIT_REQUESTS:-40}
  PRIVACY_ERASURE_NETWORK_RATE_LIMIT_REQUESTS: ${PRIVACY_ERASURE_NETWORK_RATE_LIMIT_REQUESTS:-20}
  RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-20000}
  PRICE_PROVIDER: ${PRICE_PROVIDER:-auto}
  MEAL_PLAN_STRATEGY: ${MEAL_PLAN_STRATEGY:-optimized}
  WILLYS_COLLECTION_LOCATION: ${WILLYS_COLLECTION_LOCATION:-VPS_DIRECT}
  MAX_PRICE_AGE_HOURS: ${MAX_PRICE_AGE_HOURS:-48}
  PRICE_AGE_WARNING_HOURS: ${PRICE_AGE_WARNING_HOURS:-36}
  ALLOW_PROVIDER_FALLBACK: ${ALLOW_PROVIDER_FALLBACK:-false}
  ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-false}
  OWN_SOURCES_ONLY: ${OWN_SOURCES_ONLY:-false}
  STABLE_CANDIDATE_SEARCH_ENABLED: ${STABLE_CANDIDATE_SEARCH_ENABLED:-true}
  STABLE_CANDIDATE_BASE_COUNT: ${STABLE_CANDIDATE_BASE_COUNT:-120}
  STABLE_CANDIDATE_SEARCH_LIMIT: ${STABLE_CANDIDATE_SEARCH_LIMIT:-160}
  COMMUNITY_EVIDENCE_MAX_REPORTS_PER_HOUR: ${COMMUNITY_EVIDENCE_MAX_REPORTS_PER_HOUR:-60}
  COMMUNITY_EVIDENCE_DUPLICATE_WINDOW_HOURS: ${COMMUNITY_EVIDENCE_DUPLICATE_WINDOW_HOURS:-1}
  COMMUNITY_RECEIPT_RAW_RETENTION_HOURS: ${COMMUNITY_RECEIPT_RAW_RETENTION_HOURS:-0}
  # Shared by app/status, scheduler and one-shot jobs. Production intentionally
  # has no false/empty fallback: the uncommitted env file is authoritative.
  COOP_ALLOW_FULL_CRAWL: ${COOP_ALLOW_FULL_CRAWL:?set COOP_ALLOW_FULL_CRAWL=true}
  COOP_ONLINE_CONTEXT_IDS: ${COOP_ONLINE_CONTEXT_IDS:?set COOP_ONLINE_CONTEXT_IDS=730400}

x-runtime-volumes: &runtime-volumes
  # Keep the production default beside this Compose file, while allowing an
  # isolated absolute host path (for example D:/codex-rc/runtime) at runtime.
  - ${RUNTIME_ROOT:-./runtime}/grocery:/srv/app/var/grocery
  - ${RUNTIME_ROOT:-./runtime}/plans:/srv/app/var/plans
  - ${RUNTIME_ROOT:-./runtime}/price_universes:/srv/app/var/price_universes
  - ${RUNTIME_ROOT:-./runtime}/raw_snapshots:/srv/app/var/raw_snapshots
  - ${RUNTIME_ROOT:-./runtime}/reports:/srv/app/var/reports
  - ${RUNTIME_ROOT:-./runtime}/backups:/srv/app/var/backups

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    <<: *app-image
    environment:
      TZ: Europe/Stockholm
      PYTHON_DOTENV_DISABLED: "true"
      GROCERY_DATABASE_URL: ${GROCERY_DATABASE_URL:?set GROCERY_DATABASE_URL}
    command:
      - python
      - -m
      - alembic
      - -c
      - grocery_data/alembic.ini
      - upgrade
      - head
    volumes: *runtime-volumes
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *json-logging

  app:
    <<: *app-image
    environment:
      <<: *app-environment
      SMAKO_OIDC_ISSUER_URL: ${SMAKO_OIDC_ISSUER_URL:-}
      SMAKO_OIDC_CLIENT_ID: ${SMAKO_OIDC_CLIENT_ID:-}
      SMAKO_OIDC_CLIENT_SECRET: ${SMAKO_OIDC_CLIENT_SECRET:-}
      GROCERY_RAW_SNAPSHOT_ROOT: /srv/app/var/raw_snapshots
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --app-dir
      - backend
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --timeout-keep-alive
      - "30"
      - --no-access-log
    volumes:
      - ${RUNTIME_ROOT:-./runtime}/grocery:/srv/app/var/grocery
      - ${RUNTIME_ROOT:-./runtime}/plans:/srv/app/var/plans
      - ${RUNTIME_ROOT:-./runtime}/price_universes:/srv/app/var/price_universes:ro
      - ${RUNTIME_ROOT:-./runtime}/raw_snapshots:/srv/app/var/raw_snapshots:ro
      - ${RUNTIME_ROOT:-./runtime}/reports:/srv/app/var/reports
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *json-logging
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  scheduler:
    <<: *app-image
    environment:
      <<: *app-environment
      PRIMAT_API_KEY: ${PRIMAT_API_KEY:-}
      PRIMAT_BASE_URL: ${PRIMAT_BASE_URL:-https://primat.nu/api/v3}
      HEMKOP_ALLOW_FULL_CRAWL: ${HEMKOP_ALLOW_FULL_CRAWL:-false}
      HEMKOP_STORE_EXTERNAL_IDS: ${HEMKOP_STORE_EXTERNAL_IDS:-}
      DAILY_REFRESH_ENABLED: ${DAILY_REFRESH_ENABLED:-true}
      COOP_RETRY_ENABLED: ${COOP_RETRY_ENABLED:-true}
      DAILY_REFRESH_CRON: "${DAILY_REFRESH_CRON:-17 03 * * *}"
      COOP_RETRY_CRON: "${COOP_RETRY_CRON:-17 06 * * *}"
      DAILY_BACKUP_CRON: "${DAILY_BACKUP_CRON:-47 02 * * *}"
      REFRESH_CITY: ${REFRESH_CITY:-Lund}
      REFRESH_POSTAL_CODE: ${REFRESH_POSTAL_CODE:-22350}
      REFRESH_REPORT_DIR: ${REFRESH_REPORT_DIR:-/srv/app/var/reports/refresh}
      REFRESH_TIMEOUT_SECONDS: ${REFRESH_TIMEOUT_SECONDS:-7200}
      REFRESH_RUNNER_STATUS_PATH: ${REFRESH_RUNNER_STATUS_PATH:-/srv/app/var/reports/operations/refresh-runner-status.json}
      SOURCE_RETRY_STATUS_PATH: ${SOURCE_RETRY_STATUS_PATH:-/srv/app/var/reports/operations/source-retry-status.json}
      BACKUP_ROOT: ${BACKUP_ROOT:-/srv/app/var/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-3}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-34359738368}
      INTERNAL_APP_BASE_URL: ${INTERNAL_APP_BASE_URL:-http://app:8000}
    depends_on:
      # Do not depend on app: a missing active artifact can make it restart
      # before /ready exists, while this scheduler is the recovery path.
      migrate:
        condition: service_completed_successfully
    user: root
    command:
      - python
      - deploy/scripts/start_cron.py
    volumes: *runtime-volumes
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0755
      - /etc/cron.d:size=1m,mode=0755
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *json-logging

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *json-logging

  refresh-once:
    <<: *app-image
    environment:
      <<: *app-environment
      PRIMAT_API_KEY: ${PRIMAT_API_KEY:-}
      PRIMAT_BASE_URL: ${PRIMAT_BASE_URL:-https://primat.nu/api/v3}
      HEMKOP_ALLOW_FULL_CRAWL: ${HEMKOP_ALLOW_FULL_CRAWL:-false}
      HEMKOP_STORE_EXTERNAL_IDS: ${HEMKOP_STORE_EXTERNAL_IDS:-}
      REFRESH_CITY: ${REFRESH_CITY:-Lund}
      REFRESH_POSTAL_CODE: ${REFRESH_POSTAL_CODE:-22350}
      REFRESH_REPORT_DIR: ${REFRESH_REPORT_DIR:-/srv/app/var/reports/refresh}
      REFRESH_TIMEOUT_SECONDS: ${REFRESH_TIMEOUT_SECONDS:-7200}
      REFRESH_RUNNER_STATUS_PATH: ${REFRESH_RUNNER_STATUS_PATH:-/srv/app/var/reports/operations/refresh-runner-status.json}
      SOURCE_RETRY_STATUS_PATH: ${SOURCE_RETRY_STATUS_PATH:-/srv/app/var/reports/operations/source-retry-status.json}
      BACKUP_ROOT: ${BACKUP_ROOT:-/srv/app/var/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-3}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-34359738368}
      INTERNAL_APP_BASE_URL: ${INTERNAL_APP_BASE_URL:-http://app:8000}
    profiles: ["ops"]
    command:
      - python
      - deploy/scripts/run_daily_refresh.py
    volumes: *runtime-volumes
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *json-logging

  backup-once:
    <<: *app-image
    environment:
      TZ: Europe/Stockholm
      PYTHON_DOTENV_DISABLED: "true"
      APP_VERSION: ${APP_VERSION:-0.1.0-beta}
      BUILD_ID: ${BUILD_ID:-local}
      GROCERY_DATABASE_URL: ${GROCERY_DATABASE_URL:?set GROCERY_DATABASE_URL}
      PLAN_STORE_PATH: ${PLAN_STORE_PATH:?set PLAN_STORE_PATH}
      PRICE_UNIVERSE_CACHE_ROOT: ${PRICE_UNIVERSE_CACHE_ROOT:?set PRICE_UNIVERSE_CACHE_ROOT}
      PRICE_UNIVERSE_CITY: ${PRICE_UNIVERSE_CITY:-Lund}
      MUNICIPAL_COLLECTION_SCOPE_PATH: ${MUNICIPAL_COLLECTION_SCOPE_PATH:-/srv/app/var/grocery/municipal-collection-scopes.json}
      COOP_MUNICIPAL_OFFERS_ROOT: ${COOP_MUNICIPAL_OFFERS_ROOT:-/srv/app/var/grocery/coop-municipal-offers}
      ICA_STRUCTURED_OFFERS_ROOT: ${ICA_STRUCTURED_OFFERS_ROOT:-/srv/app/var/grocery/ica-structured-offers}
      HEMKOP_MUNICIPAL_ROOT: ${HEMKOP_MUNICIPAL_ROOT:-/srv/app/var/grocery/hemkop-municipal}
      LIDL_MUNICIPAL_ROOT: ${LIDL_MUNICIPAL_ROOT:-/srv/app/var/grocery/lidl-municipal}
      CITYGROSS_MUNICIPAL_ROOT: ${CITYGROSS_MUNICIPAL_ROOT:-/srv/app/var/grocery/citygross-municipal}
      WILLYS_FLYER_ROOT: ${WILLYS_FLYER_ROOT:-/srv/app/var/grocery/willys-flyer}
      BACKUP_ROOT: ${BACKUP_ROOT:-/srv/app/var/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    profiles: ["ops"]
    command:
      - python
      - deploy/scripts/backup_sqlite.py
    volumes: *runtime-volumes
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *json-logging

volumes:
  caddy_data:
  caddy_config:
