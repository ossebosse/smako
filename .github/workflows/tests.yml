name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [core, planner, integration]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-dev.lock
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Use the Ubuntu archive for system dependencies
        if: matrix.suite != 'integration'
        # Avoid prolonged downloads from the runner's Azure mirror.
        # Keep Ubuntu's suites, signing keys and package verification unchanged.
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|://azure\.archive\.ubuntu\.com/ubuntu|://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - name: Browsers for UI tests
        if: matrix.suite != 'integration'
        run: python -m playwright install --with-deps chromium webkit
      - name: Startup check
        run: python scripts/dev.py --check
      - name: Ruff on changed Python files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -n "$files" ]; then python -m ruff check $files; fi
      - name: Offline backend tests
        # Tests that replay untracked evidence under reports/ are reported as
        # skipped with the missing path (see conftest.py and docs/TESTING.md).
        env:
          TEST_SUITE: ${{ matrix.suite }}
          SMAKO_VERIFY_LABEL: ci-${{ matrix.suite }}
        run: |
          planner_tests=(
            backend/tests/test_owned_planner_artifacts.py
            backend/tests/test_complete_scope_incumbents.py
            backend/tests/test_own_provider.py
            backend/tests/test_own_provider_grocery_data_contract.py
            backend/tests/test_personal_choices_browser.py
          )
          # These measured long-running contracts do not launch browsers.
          # Keep new tests in core automatically; every partition is required.
          integration_tests=(
            backend/tests/test_coop_municipality_provider.py
            backend/tests/test_all_intake_links.py
            backend/tests/test_diversity_mode_api_contract.py
            backend/tests/test_optimized_llm_improvement.py
            backend/tests/test_verified_menu_search.py
          )
          if [ "$TEST_SUITE" = planner ]; then
            targets=("${planner_tests[@]}")
          elif [ "$TEST_SUITE" = integration ]; then
            targets=("${integration_tests[@]}")
          else
            targets=(backend/tests)
            for path in "${planner_tests[@]}" "${integration_tests[@]}"; do targets+=("--ignore=$path"); done
          fi
          python scripts/verify_offline.py "${targets[@]}" -m "not live" -q --no-header -rfEs --durations=30 --junitxml=.local/verification/backend-tests.xml
      - name: Preserve test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.suite }}
          path: .local/verification/backend-tests.xml
          retention-days: 7

  backend:
    if: always()
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every test partition
        env:
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$TEST_RESULT" = success
