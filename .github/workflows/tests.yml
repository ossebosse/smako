name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-dev.lock
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Browsers for UI tests
        run: python -m playwright install --with-deps chromium webkit
      - name: Startup check
        run: python scripts/dev.py --check
      - name: Ruff on changed Python files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -n "$files" ]; then python -m ruff check $files; fi
      - name: Offline backend tests
        # Tests that replay untracked evidence under reports/ are reported as
        # skipped with the missing path (see conftest.py and docs/TESTING.md).
        run: python scripts/verify_offline.py backend/tests -m "not live" -q --no-header -rfEs
